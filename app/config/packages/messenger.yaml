# Configuration Symfony Messenger pour traitement asynchrone des notifications
framework:
    messenger:
        # Échec des messages
        failure_transport: failed

        transports:
            # Stockage des messages en attente (utilise Doctrine)
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    # Tentatives de retraitement en cas d'échec
                    auto_setup: true
                retry_strategy:
                    max_retries: 3
                    # Délai entre les tentatives (en millisecondes)
                    delay: 1000
                    # Multiplieur du délai à chaque tentative
                    multiplier: 2
                    max_delay: 0

            # Transport pour les messages en échec
            failed: 'doctrine://default?queue_name=failed'

        routing:
            # Messages qui doivent être traités en asynchrone
            # Pour l'instant, on désactive le routage automatique
            # Vous pouvez créer des messages spécifiques pour les notifications plus tard
            # Par exemple: App\Message\SendNotificationMessage: async
            # '*': async

        # Configuration des handlers asynchrones
        default_bus: messenger.bus.default
