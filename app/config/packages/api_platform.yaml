api_platform:
    title: 'Ouma Traiteur API'
    description: 'API REST pour la gestion de devis et factures - Ouma Traiteur, Mauritanie'
    version: '1.0.0'
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    docs_formats:
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    enable_swagger_ui: true
    enable_swagger: true
